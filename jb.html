<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 Exploit - iPhone City</title>
    <style>
      :root {
        --bg:#06090f;
        --card:rgba(8,12,18,.78);
        --line:rgba(65,165,255,.28);
        --text:#edf2ff;
        --muted:#b7c4d8;
        --blue:#27b0ff;
        --yellow:#ffd32a;
        --ok:#8ef2ae;
        --warn:#ffe07f;
        --bad:#ff9b96;
      }
      * { box-sizing:border-box; }
      html, body { margin:0; padding:0; min-height:100%; }
      body {
        color:var(--text);
        font:15px/1.45 "Segoe UI", system-ui, sans-serif;
        background:
          linear-gradient(rgba(3,7,12,.84), rgba(3,7,12,.92)),
          url("loadingpro_splash.png") center/cover no-repeat fixed;
      }
      body::before {
        content:""; position:fixed; inset:0; pointer-events:none;
        background:
          radial-gradient(circle at 15% 18%, rgba(39,176,255,.16), transparent 32%),
          radial-gradient(circle at 84% 78%, rgba(255,211,42,.13), transparent 28%);
      }
      #splash {
        position:fixed; inset:0; z-index:30;
        display:flex; align-items:center; justify-content:center;
        background:linear-gradient(rgba(2,5,9,.45), rgba(2,5,9,.6)), url("loadingpro_splash.png") center/cover no-repeat;
        transition:opacity .65s ease, visibility .65s ease;
      }
      body.loaded #splash { opacity:0; visibility:hidden; }
      .splash-card {
        width:min(92vw, 540px); text-align:center; padding:28px 24px 24px;
        border-radius:24px; background:rgba(6,10,16,.55);
        border:1px solid rgba(255,255,255,.1);
        box-shadow:0 18px 55px rgba(0,0,0,.35);
        backdrop-filter: blur(6px);
      }
      .splash-card img { 
        max-width:210px; 
        width:65%; 
        display:block; 
        margin:0 auto 16px; 
        background:#ffffff;
        padding:10px 18px;
        border-radius:18px;
        box-shadow:0 4px 18px rgba(0,0,0,.5);
      }
      .splash-card h1 { margin:0; font-size:clamp(26px, 4.5vw, 44px); letter-spacing:.06em; font-weight:900; }
      .splash-card h1 span:first-child { background:linear-gradient(180deg,#ffffff,#b8c0cf); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .splash-card h1 span:last-child { background:linear-gradient(180deg,#ffe96a,#ffbb00); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .splash-sub { color:#d7e1f2; letter-spacing:.15em; font-size:13px; margin:8px 0 18px; }
      .loader-track {
        height:14px; width:min(100%, 340px); margin:0 auto; border-radius:999px;
        border:1px solid rgba(255,255,255,.16); padding:2px; background:rgba(0,0,0,.35);
      }
      .loader-bar {
        height:100%; width:100%; border-radius:999px;
        background:linear-gradient(90deg, var(--blue), #57d0ff 45%, var(--yellow) 100%);
        transform-origin:left center; animation:barload 2.15s ease-in-out forwards;
        box-shadow:0 0 18px rgba(39,176,255,.45), 0 0 18px rgba(255,211,42,.3);
      }
      @keyframes barload { from { transform:scaleX(.06);} to { transform:scaleX(1);} }
      #page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px; }
      #panel {
        width:min(92vw, 760px); background:var(--card); border:1px solid var(--line);
        border-radius:26px; box-shadow:0 18px 55px rgba(0,0,0,.34);
        backdrop-filter: blur(10px); overflow:hidden;
      }
      #brand {
        display:flex; align-items:center; gap:14px; padding:18px 20px 14px;
        border-bottom:1px solid rgba(255,255,255,.08);
      }
      #brand img { 
        height:50px; 
        width:auto; 
        max-width:130px; 
        background:#ffffff; 
        border-radius:10px; 
        padding:4px 8px; 
        object-fit:contain; 
        box-shadow:0 2px 10px rgba(0,0,0,.4); 
      }
      #brand b {
        display:block; font-size:24px; line-height:1.1; letter-spacing:.05em; font-weight:900;
      }
      #brand b span:first-child { background:linear-gradient(180deg,#ffffff,#b7bfcd); -webkit-background-clip:text; background-clip:text; color:transparent; }
      #brand b span:last-child { background:linear-gradient(180deg,#ffe96a,#ffbb00); -webkit-background-clip:text; background-clip:text; color:transparent; }
      #brand small { display:block; margin-top:5px; color:var(--muted); font-size:12px; }
      #hero { padding:20px 20px 6px; text-align:center; }
      #spin {
        width:54px; height:54px; margin:10px auto 14px; border:4px solid rgba(255,255,255,.14);
        border-top-color:var(--yellow); border-right-color:var(--blue); border-radius:50%;
        animation:spin .9s linear infinite;
        box-shadow:0 0 18px rgba(39,176,255,.2);
      }
      @keyframes spin { to { transform:rotate(360deg); } }
      #msg { display:none; font-size:16px; color:var(--muted); margin:6px 0 8px; }
      #wrap { padding:0 20px 20px; }
      #state, #out { display:none; }
      body.done #spin, body.fail #spin { display:none; }
      body.fail #msg { display:block; }
      body.log #spin, body.log #msg { display:none; }
      body.log #state {
        display:block; font-size:24px; font-weight:800; margin:0 0 10px;
      }
      body.log #wrap { padding:0 20px 20px; }
      body.log #out {
        display:block; white-space:pre-wrap; font:12px/1.5 Consolas, monospace;
        background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:16px;
        padding:14px 16px; height:min(62vh, 560px); overflow-y:auto;
      }
      .ok, .safe { color:var(--ok); }
      .bad, .danger { color:var(--bad); }
      .warn { color:var(--warn); }
      code { color:#9fd2ff; }

      .credit-box {
        padding:12px 20px 14px;
        border-top:1px solid rgba(255,255,255,.08);
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-size:12px;
        color:var(--muted);
        direction:rtl;
      }
      .credit-box .phone-badge {
        color:#00FF00;
        font-weight:bold;
        direction:ltr;
      }

      @media (max-width:640px){
        #panel { border-radius:22px; }
        #brand { padding:16px 16px 12px; }
        #brand b { font-size:20px; }
        #hero { padding:18px 16px 4px; }
        #wrap, body.log #wrap { padding:0 16px 16px; }
        .credit-box { flex-direction:column; gap:6px; text-align:center; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-card">
        <img src="logo.png" alt="iPhone City logo">
        <h1><span>IPHONE</span> <span>CITY</span></h1>
        <div class="splash-sub">آيفون سيتي للأجهزة الذكية - الحديدة شارع صنعاء</div>
        <div class="loader-track"><div class="loader-bar"></div></div>
      </div>
    </div>
    <div id="page">
      <div id="panel">
        <div id="brand">
          <img src="logo.png" alt="iPhone City logo" />
          <div>
            <b><span>IPHONE</span> <span>CITY</span></b>
            <small>الحديدة - شارع صنعاء | هاتف: 777102029</small>
          </div>
        </div>
        <div id="hero">
          <div id="spin"></div>
          <div id="msg">Restart your console</div>
        </div>
        <div id="wrap">
          <div id="state"></div>
          <div id="out"></div>
        </div>
        <div class="credit-box">
          <span>تصميم وبرمجة: المهندس أسامة مهدي - خصيصاً لمحل آيفون سيتي</span>
          <span class="phone-badge">777102029 | 777771049</span>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => setTimeout(() => document.body.classList.add('loaded'), 2200));
      setTimeout(() => document.body.classList.add('loaded'), 2800);
    </script>
    <script type="module">
      import "./jb.js?v=11";
    </script>
  </body>
</html>
